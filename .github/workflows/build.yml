name: Build Payroll Report

# PyInstaller cannot cross-compile, so each platform builds on its own runner.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple Silicon
            artifact: Payroll-Report-macOS-arm64
          # macos-13 (Intel) is intentionally absent: GitHub's free Intel-Mac
          # runner pool is tiny and the job routinely never gets scheduled,
          # holding the whole release open. Restore the two lines below if
          # anyone actually needs an Intel build.
          #   - os: macos-13
          #     artifact: Payroll-Report-macOS-intel
          - os: windows-latest
            artifact: Payroll-Report-Windows
          - os: ubuntu-22.04      # oldest supported glibc, for portability
            artifact: Payroll-Report-Linux

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tkinter (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      - name: Install dependencies
        run: python -m pip install --upgrade pip openpyxl pyinstaller

      - name: Self-test
        run: python selftest.py

      - name: Fuzz against the output contracts
        run: python fuzz.py -n 1000

      - name: Build
        run: python build.py

      # The tests above run against the source. This proves the *binary* runs.
      - name: Smoke-test the built app (macOS)
        if: runner.os == 'macOS'
        run: "'dist/Payroll Report.app/Contents/MacOS/Payroll Report' --smoke"

      - name: Smoke-test the built app (Windows)
        if: runner.os == 'Windows'
        run: |
          # A --windowed exe is a GUI-subsystem binary: PowerShell does not wait
          # on it and never sets $LASTEXITCODE, so ask for the process object.
          $p = Start-Process -FilePath "dist/Payroll Report.exe" `
                             -ArgumentList "--smoke" -Wait -PassThru -NoNewWindow
          Write-Host "exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Smoke-test the built app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./dist/payroll-report --smoke

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          # ditto preserves the bundle's symlinks and permissions; zip does not.
          ditto -c -k --keepParent "Payroll Report.app" "../${{ matrix.artifact }}.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path "dist/Payroll Report.exe" -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: cd dist && tar czf "../${{ matrix.artifact }}.tar.gz" payroll-report

      - name: Checksums
        shell: bash
        run: |
          # Published on the release so anyone can verify their download.
          # The Windows runner has sha256sum but not shasum, and a failed
          # redirect still creates an empty file that the release API rejects.
          for f in ${{ matrix.artifact }}.zip ${{ matrix.artifact }}.tar.gz; do
            [ -f "$f" ] || continue
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
            if [ -s "$f.sha256" ]; then cat "$f.sha256"; else rm -f "$f.sha256"; fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.*.sha256
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body: |
            Download the file for your machine, unzip it, and double-click.
            No Python or other installation needed.

            - **macOS (Apple Silicon)** — `Payroll-Report-macOS-arm64.zip`
            - **Windows 10/11** — `Payroll-Report-Windows.zip`
            - **Linux** — `Payroll-Report-Linux.tar.gz`

            **First launch shows a one-time security warning**, because the app is
            not signed with a paid certificate. It appears once per computer.

            - **macOS 15 and later** — double-click, let it be blocked, then go to
              **System Settings > Privacy & Security**, scroll to **Security**, and
              click **Open Anyway**. (On macOS 14 and earlier: right-click > **Open**.)
            - **Windows** — **More info** > **Run anyway**.

            Copying the app from a file share or USB drive instead of downloading it
            avoids the warning entirely.

            `.sha256` files are included if you want to verify your download.
